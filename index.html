<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>키오스크 주문 연습 앱</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f8ff;color:#202b35;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}.app{width:100%;max-width:none;margin:0 auto;padding:18px 24px}h1{text-align:center;color:#19517c;font-size:clamp(32px,5vw,48px);margin:14px 0}h2{text-align:center;font-size:clamp(26px,4vw,36px);margin:14px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.menu-card,.panel,.line{background:white;border:3px solid #c7dded;border-radius:22px;padding:18px}.menu-card{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#fff;min-height:270px;position:relative}.menu-card:active{background:#fff0d6;transform:scale(.98)}.menu-card:focus-visible{outline:5px solid #f7941d;outline-offset:3px}.menu-card .tap-hint{font-size:clamp(17px,1.7vw,21px);font-weight:750;color:#246198}.menu-card .in-cart{position:absolute;right:10px;top:9px;background:#ffe2ac;color:#7a4600;padding:5px 10px;border-radius:20px;font-size:17px;font-weight:800}.emoji{font-size:clamp(88px,11vw,136px);line-height:1.15}.name{font-size:clamp(25px,3.2vw,34px);font-weight:800}.price{font-size:clamp(23px,2.8vw,30px);font-weight:750;color:#a45400}.btn{min-height:65px;min-width:80px;border:0;border-radius:16px;font:800 clamp(21px,2.6vw,27px) inherit;font-size:clamp(21px,2.6vw,27px);font-weight:800;cursor:pointer;padding:12px 20px;touch-action:manipulation}.btn:focus-visible{outline:5px solid #ff9900;outline-offset:3px}.add,.primary{background:#176fc2;color:#fff}.add{width:100%;margin-top:auto}.secondary{background:#e4ebf0;color:#21374c}.danger{background:#fff0ee;color:#9c302b;border:2px solid #e8aaa5}.btn:disabled{background:#d4dce4;color:#727b83;cursor:not-allowed}.panel{margin-top:20px}.split-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:stretch;min-height:calc(100vh - 245px)}.menu-side,.cart-side{min-width:0}.menu-side{padding:18px;border-radius:24px;background:#e3f0fb}.menu-side h2{margin:4px 0 20px}.cart-side{background:#fff;border:3px solid #c7dded;border-radius:24px;padding:18px 22px;display:flex;flex-direction:column}.cart-side .panel-title{margin-bottom:10px}.cart-side #cartLines{flex:1}.cart-side .totals{margin-top:16px}.cart-side .full{margin:18px 0 0}.menu-side .grid{gap:16px}.menu-side .menu-card{min-height:285px}.cart-side .line{grid-template-columns:1fr;gap:7px;padding:13px;margin:9px 0}.cart-side .controls{justify-content:flex-start}.cart-side .small{min-width:52px;min-height:50px}.remove-mark{font-size:1.25em;font-weight:950;line-height:1}.cart-side .line-text{font-size:clamp(21px,2vw,27px)}.panel-title{font-size:clamp(26px,3vw,32px);font-weight:850;margin:0 0 15px}.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin:12px 0;padding:14px}.line-text{font-size:clamp(20px,2.4vw,27px);font-weight:750}.detail{font-size:clamp(19px,2vw,24px);margin-top:7px;color:#554b40}.controls{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px}.qty{font-size:27px;min-width:35px;text-align:center;font-weight:900}.small{min-height:55px;min-width:55px;padding:6px 12px}.totals{background:#fff1c7;border-radius:17px;margin-top:14px;padding:18px;font-weight:850;font-size:clamp(23px,3vw,32px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.actions .btn{width:100%}.full{width:100%;margin:20px 0}.notice{background:#fff7dd;border:2px solid #e4c46e;border-radius:15px;text-align:center;padding:16px;font-size:clamp(19px,2vw,24px);font-weight:750;margin:24px 0}.hidden{display:none!important}.finish{text-align:center;color:#146146;font-size:clamp(29px,4vw,42px);font-weight:900}.number{text-align:center;background:#ffe9aa;border-radius:18px;padding:18px;margin:20px 0}.number strong{font-size:clamp(56px,9vw,90px);display:block;color:#a25700}.instruction{text-align:center;font-size:clamp(25px,3vw,34px);font-weight:850;margin:18px 0}.empty{text-align:center;font-size:25px;padding:25px 6px;color:#485b6b}@media(min-width:700px) and (max-width:1050px){.split-layout{gap:12px}.menu-side,.cart-side{padding:12px}.menu-side .grid{gap:10px}.menu-side .menu-card{min-height:235px;padding:12px 7px}.menu-side .emoji{font-size:90px}.menu-side .name{font-size:24px}.menu-side .price{font-size:22px}.cart-side .line{padding:10px}.cart-side .controls{gap:5px}.cart-side .small{min-height:48px;min-width:47px;padding:5px 9px}}@media(max-width:699px){.split-layout{grid-template-columns:1fr;min-height:0}.menu-side,.cart-side{padding:14px}.menu-side .menu-card{min-height:215px}.app{padding:10px}.grid{gap:9px}.menu-card{padding:12px 7px}.line{grid-template-columns:1fr}.controls{justify-content:flex-start}.btn{padding:10px}.small{min-width:51px}.actions{gap:8px}}@media(max-width:620px){.app{padding:10px}.grid{gap:9px}.menu-card{padding:12px 7px}.line{grid-template-columns:1fr}.controls{justify-content:flex-start}.btn{padding:10px}.small{min-width:51px}.actions{gap:8px}}
</style>
</head>
<body><main class="app"><h1>키오스크 주문 앱</h1>
<section id="menuScreen"><div class="split-layout"><div class="menu-side"><h2>먹고 싶은 음식을 선택해요.</h2><div class="grid" id="menuGrid"></div></div><div class="cart-side"><div class="panel-title">🛒 주문 내역 (장바구니)</div><div id="cartLines" aria-live="polite"></div><div id="cartTotals" class="totals"></div><button id="confirmBtn" class="btn primary full" disabled>주문 확인 →</button></div></div></section>
<section id="confirmScreen" class="hidden"><h2>주문 확인</h2><div class="panel"><div class="panel-title">담은 메뉴</div><div id="confirmLines"></div><div id="confirmTotals" class="totals"></div><p class="instruction">이 메뉴를 주문할까요?</p></div><div class="actions"><button class="btn secondary" id="backBtn">다시 고르기</button><button class="btn primary" id="orderBtn">주문하기</button></div></section>
<section id="completeScreen" class="hidden"><div class="panel"><p class="finish">✅ 주문 연습을 마쳤어요!</p><div class="panel-title">주문한 메뉴</div><div id="completeLines"></div><div id="completeTotals" class="totals"></div><div class="number"><span class="line-text">연습용 주문번호</span><strong>001</strong></div><p class="instruction">번호가 불리면 음식을 받아요.</p></div><button class="btn primary full" id="resetBtn">다시 연습하기</button></section>
<p class="notice">연습용 화면이며 실제 주문과 결제는 되지 않아요.</p></main>
<script>
const menus=[{name:'햄버거',price:5000,emoji:'🍔'},{name:'샌드위치',price:4000,emoji:'🥪'},{name:'콜라',price:2000,emoji:'🥤'},{name:'오렌지주스',price:2000,emoji:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="1em" height="1em" role="img" aria-label="오렌지 그림이 있는 오렌지주스 팩" style="vertical-align:middle;overflow:visible"><path d="M22 26 L37 7 H73 L88 26 V108 Q88 112 84 112 H22 Q17 112 17 107 V31 Q17 27 22 26Z" fill="#FFB24C" stroke="#A96020" stroke-width="3"/><path d="M22 26 L37 7 H73 L58 26Z" fill="#FFE2A2" stroke="#A96020" stroke-width="2"/><path d="M58 26 L73 7 L88 26Z" fill="#F18B36" stroke="#A96020" stroke-width="2"/><rect x="28" y="35" width="49" height="63" rx="6" fill="#FFF9E9"/><circle cx="52" cy="67" r="18" fill="#F7941D" stroke="#DE6F10" stroke-width="2"/><path d="M52 48 Q54 40 62 41 Q59 49 52 49" fill="#429D49"/><path d="M52 49 Q48 42 44 41" fill="none" stroke="#4A8E34" stroke-width="2" stroke-linecap="round"/><path d="M52 55 V79 M40 62 L64 74 M64 62 L40 74" stroke="#FFD18A" stroke-width="2" opacity=".7"/><path d="M65 6 L84 0" stroke="#64BEEB" stroke-width="6" stroke-linecap="round"/><path d="M65 6 L68 30" stroke="#64BEEB" stroke-width="5" stroke-linecap="round"/></svg>'}];
const cart=Array(menus.length).fill(0);
const won=n=>n.toLocaleString('ko-KR')+'원';
const byId=id=>document.getElementById(id);
const totalCount=()=>cart.reduce((a,b)=>a+b,0);
const totalPrice=()=>cart.reduce((sum,q,i)=>sum+q*menus[i].price,0);
const totals=()=>`<span>총수량: ${totalCount()}개</span><span>합계: ${won(totalPrice())}</span>`;
function renderMenu(){byId('menuGrid').innerHTML=menus.map((m,i)=>`<button type="button" class="menu-card" data-add="${i}" aria-label="${m.name} ${won(m.price)} 장바구니에 한 개 담기"><span class="emoji" aria-hidden="true">${m.emoji}</span><span class="name">${m.name}</span><span class="price">${won(m.price)}</span>${cart[i]?`<span class="in-cart">${cart[i]}개 담김</span>`:''}</button>`).join('');}
function renderCart(){let rows=menus.map((m,i)=>cart[i]?`<div class="line"><div><div class="line-text">${m.emoji} ${m.name}</div><div class="detail">${won(m.price)} × ${cart[i]}개 = <strong>${won(m.price*cart[i])}</strong></div></div><div class="controls"><button class="btn secondary small" data-minus="${i}" aria-label="${m.name} 수량 줄이기">−</button><span class="qty" aria-label="수량 ${cart[i]}개">${cart[i]}</span><button class="btn primary small" data-plus="${i}" aria-label="${m.name} 수량 늘리기">+</button><button class="btn danger small" data-remove="${i}" aria-label="${m.name} 삭제"><span class="remove-mark" aria-hidden="true">✕</span> 삭제</button></div></div>`:'').join('');byId('cartLines').innerHTML=rows||'<div class="empty">장바구니가 비어 있어요.<br>왼쪽에서 메뉴를 선택하세요</div>';byId('cartTotals').innerHTML=totals();byId('confirmBtn').disabled=totalCount()===0;renderMenu();}
function renderSummary(prefix){byId(prefix+'Lines').innerHTML=menus.map((m,i)=>cart[i]?`<div class="line"><div class="line-text">${m.emoji} ${m.name} × ${cart[i]}개</div><div class="price">${won(m.price*cart[i])}</div></div>`:'').join('');byId(prefix+'Totals').innerHTML=totals();}
function show(id){['menuScreen','confirmScreen','completeScreen'].forEach(s=>byId(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}
byId('menuGrid').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;cart[Number(b.dataset.add)]++;renderCart();});
byId('cartLines').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plus!==undefined)cart[Number(b.dataset.plus)]++;else if(b.dataset.minus!==undefined)cart[Number(b.dataset.minus)]=Math.max(0,cart[Number(b.dataset.minus)]-1);else if(b.dataset.remove!==undefined)cart[Number(b.dataset.remove)]=0;renderCart();});
byId('confirmBtn').addEventListener('click',()=>{if(!totalCount())return;renderSummary('confirm');show('confirmScreen');});
byId('backBtn').addEventListener('click',()=>{renderCart();show('menuScreen');});
byId('orderBtn').addEventListener('click',()=>{renderSummary('complete');show('completeScreen');});
byId('resetBtn').addEventListener('click',()=>{cart.fill(0);renderCart();show('menuScreen');});
renderMenu();renderCart();
</script></body></html>
